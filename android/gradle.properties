org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround for "this and base files have different roots" / "Could not close
# incremental caches" build failures on Windows when the project drive (e.g. D:)
# differs from the Flutter SDK / pub-cache drive (e.g. C:). The Kotlin
# incremental compiler tries to compute a relative path between the two and
# crashes when they don't share a drive letter. Disabling incremental
# compilation avoids the crash entirely.
kotlin.incremental=false